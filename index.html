<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quant Question Bank</title>
  <meta name="description" content="A modern question bank for later-round quant interviews. Probability, geometry, combinatorics, games, statistics, and strategy - with hidden solutions and interactive figures." />
  <meta property="og:title" content="Quant Question Bank" />
  <meta property="og:description" content="Later-round quant interview problems with timers, hidden solutions, and a figure for every argument." />
  <meta property="og:url" content="https://quant-question-bank.vercel.app" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="theme-color" content="#080b12" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23080b12'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='28' fill='%23e2c57a' font-family='Georgia'%3EQ%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body data-view="home">
  <a class="skip" href="#stage">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#home">
      <span class="brand-mark">Q</span>
      <span class="brand-text">
        <strong>Question Bank</strong>
        <em>Quant interviews</em>
      </span>
    </a>
    <nav class="topnav" aria-label="Primary">
      <a href="#home" data-nav="home">Home</a>
      <a href="#catalog" data-nav="catalog">Catalog</a>
      <a href="#topics" data-nav="topics">Topics</a>
    </nav>
    <button class="search-launch" type="button" data-open-search>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
        <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>Search</span>
      <kbd data-kbd>⌘K</kbd>
    </button>
    <a class="gh" href="https://github.com/ctt062/quant-question-bank" target="_blank" rel="noreferrer">GitHub</a>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="site-foot">
    <div class="foot-inner">
      <div>
        <strong>Quant Question Bank</strong>
        <p>Interactive later-round interview problems. Solutions stay hidden until you reveal them.</p>
      </div>
      <a class="gh-repo" href="https://github.com/ctt062/quant-question-bank" target="_blank" rel="noreferrer">⭐ Star my GitHub repo</a>
      <p class="foot-meta">MIT license · Progress stays in this browser · Press <span data-kbd>⌘K</span> to search</p>
    </div>
  </footer>

  <div class="cmdk" id="cmdk" hidden>
    <div class="cmdk-scrim" data-close-search></div>
    <div class="cmdk-panel" role="dialog" aria-modal="true" aria-label="Search problems">
      <div class="cmdk-input-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="cmdk-input" type="search" placeholder="Search titles, topics, or difficulty…" autocomplete="off" spellcheck="false" />
        <kbd>esc</kbd>
      </div>
      <div class="cmdk-results" id="cmdk-results"></div>
    </div>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="js/problems.js"></script>
  <script defer src="js/problems-more.js"></script>
  <script defer src="js/problems-fill-a.js"></script>
  <script defer src="js/problems-fill-b.js"></script>
  <script defer src="js/problems-fill-c.js"></script>
  <script defer src="js/visuals/engine.js"></script>
  <script defer src="js/visuals/sim.js"></script>
  <script defer src="js/visuals.js"></script>
  <script defer src="js/visuals/probability.js"></script>
  <script defer src="js/visuals/geometric.js"></script>
  <script defer src="js/visuals/combinatorics.js"></script>
  <script defer src="js/visuals/games.js"></script>
  <script defer src="js/visuals/statistics.js"></script>
  <script defer src="js/visuals/strategy.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
